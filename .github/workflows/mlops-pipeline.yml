name: Fraud Detection MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Formatting & Linting Check
      run: |
        black --check src/
        flake8 src/

    - name: Run Pytest
      run: |
        pytest -v tests/

    - name: Build Docker Container
      run: |
        docker build -t fraud-detection-mlops:ci .